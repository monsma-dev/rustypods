syntax = "proto3";

package rustypods.v1;

// Control plane: pod lifecycle over a Unix domain socket.
// Phase-2 RPCs (Exec, PodMetrics, StreamLogs) are declared now for API
// stability; the daemon returns UNIMPLEMENTED until then.
service PodControl {
  rpc Ping(PingRequest) returns (DaemonInfo);

  rpc ImportImage(ImportImageRequest) returns (Image);
  rpc ListImages(ListImagesRequest) returns (ImageList);
  rpc RemoveImage(ImageRef) returns (Empty);

  rpc CreatePod(CreatePodRequest) returns (Pod);
  rpc StartPod(StartPodRequest) returns (Pod);
  rpc StopPod(PodRef) returns (Pod);
  rpc ListPods(ListPodsRequest) returns (PodList);
  rpc DestroyPod(PodRef) returns (Empty);
  // Hot-reload limits: schrijf conf + pas direct toe op de scope (geen reboot).
  rpc UpdatePodConfig(UpdatePodConfigRequest) returns (Pod);
  // Herlees een hand-ge-editte conf van schijf en pas toe.
  rpc ReloadPodConfig(PodRef) returns (Pod);

  rpc Exec(stream ExecChunk) returns (stream ExecChunk);
  rpc PodMetrics(PodRef) returns (stream Metric);
  rpc StreamLogs(PodRef) returns (stream LogLine);

  rpc CreateShm(ShmRequest) returns (ShmSegment);
  rpc ListShm(PodRef) returns (ShmList);
  rpc RemoveShm(ShmRef) returns (Empty);
}

// In-pod agent → daemon, on the per-pod socket /run/rustypods/run/agent.sock.
service Agent {
  rpc Ping(Empty) returns (AgentInfo);
  rpc StreamMetrics(stream Metric) returns (Empty);
}

message AgentInfo {
  string version = 1;
}

// mmap-able shared segment: host path under /dev/shm/rustypods/<pod>,
// pod path under /run/rustypods/shm. Same pages both sides (tmpfs).
message ShmRequest {
  string pod = 1;
  string name = 2;
  uint64 size_bytes = 3;
}
message ShmSegment {
  string name = 1;
  string host_path = 2;
  string pod_path = 3;
  uint64 size_bytes = 4;
}
message ShmList {
  repeated ShmSegment segs = 1;
}
message ShmRef {
  string pod = 1;
  string name = 2;
}

message Empty {}
message PingRequest {}

message DaemonInfo {
  string version = 1;
  string socket_path = 2;
  string data_dir = 3;
  bool machined = 4;
  bool btrfs = 5;
}

message Image {
  string name = 1;
  string path = 2;
  string source = 3;
  uint64 created_unix = 4;
}

message ImageList {
  repeated Image images = 1;
}

message ImageRef {
  string name = 1;
}

message ListImagesRequest {}

message ImportImageRequest {
  string name = 1;
  // Rootless podman container to export (e.g. "arch").
  string distrobox = 2;
  // Host user owning the rootless podman store (root podman cannot see it).
  string import_user = 3;
}

enum PodState {
  POD_STATE_UNKNOWN = 0;
  POD_STATE_CREATED = 1;
  POD_STATE_RUNNING = 2;
  POD_STATE_STOPPED = 3;
  POD_STATE_FAILED = 4;
}

message Limits {
  // 0 = unset. Applied to machine-<name>.scope after nspawn registers.
  uint64 memory_high_bytes = 1;
  uint64 memory_max_bytes = 2;
  uint32 cpu_quota_percent = 3;
}

message Pod {
  string name = 1;
  string image = 2;
  string rootfs = 3;
  PodState state = 4;
  uint32 leader_pid = 5;
  uint64 created_unix = 6;
  Limits limits = 7;
  bool ephemeral = 8;
}

message PodList {
  repeated Pod pods = 1;
}

message PodRef {
  string name = 1;
}

message ListPodsRequest {}

message CreatePodRequest {
  string name = 1;
  string image = 2;
}

message UpdatePodConfigRequest {
  string name = 1;
  Limits limits = 2;
}

message StartPodRequest {
  string name = 1;
  Limits limits = 2;
  // -x: nspawn snapshots the pod dir itself and discards changes on exit.
  bool ephemeral = 3;
  // Stronger isolation at the cost of host-uid identity (breaks shared
  // home-dir writes as `nick`). Maps to nspawn --private-users=pick.
  bool private_users = 4;
}

// Bidi exec: first client chunk is `start`; then stdin/winsize flow in,
// stdout/stderr/exit flow out.
message ExecChunk {
  oneof kind {
    ExecStart start = 1;
    bytes stdin = 2;
    bytes stdout = 3;
    bytes stderr = 4;
    WinSize winsize = 5;
    ExecExit exit = 6;
  }
}

message ExecStart {
  string pod = 1;
  // Container user; empty = root.
  string user = 2;
  // Empty argv → login shell ($SHELL -l from the image's /etc/passwd).
  repeated string argv = 3;
  bool tty = 4;
  uint32 rows = 5;
  uint32 cols = 6;
  repeated string env = 7; // "K=V", TERM etc.
}

message WinSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecExit {
  int32 code = 1;
}

message Metric {
  uint64 ts_unix_ms = 1;
  uint64 mem_bytes = 2;
  uint64 mem_high_bytes = 3;
  double cpu_pct = 4;
  uint64 pids = 5;
  double mem_psi_avg10 = 6;
  double io_psi_avg10 = 7;
}

message LogLine {
  uint64 ts_unix_ms = 1;
  bytes data = 2;
}
