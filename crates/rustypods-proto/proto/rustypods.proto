syntax = "proto3";

package rustypods.v1;

// Control plane: pod lifecycle over a Unix domain socket.
// Phase-2 RPCs (Exec, PodMetrics, StreamLogs) are declared now for API
// stability; the daemon returns UNIMPLEMENTED until then.
service PodControl {
  rpc Ping(PingRequest) returns (DaemonInfo);

  rpc ImportImage(ImportImageRequest) returns (Image);
  // Pull an OCI image straight from a registry (docker.io, ghcr.io, …) —
  // anonymous auth, native OS/arch, no external tools.
  rpc PullImage(PullImageRequest) returns (Image);
  rpc ListImages(ListImagesRequest) returns (ImageList);
  rpc RemoveImage(ImageRef) returns (Empty);

  rpc CreatePod(CreatePodRequest) returns (Pod);
  // Instant CoW clone: btrfs snapshot of the rootfs + copied conf with a
  // fresh name/net_index. Source may be running (snapshot is atomic).
  rpc ClonePod(ClonePodRequest) returns (Pod);
  rpc StartPod(StartPodRequest) returns (Pod);
  rpc StopPod(PodRef) returns (Pod);
  rpc ListPods(ListPodsRequest) returns (PodList);
  rpc DestroyPod(PodRef) returns (Empty);
  // Hot-reload limits: write the conf + apply to the live scope (no reboot).
  rpc UpdatePodConfig(UpdatePodConfigRequest) returns (Pod);
  // Reread a hand-edited conf from disk and apply it.
  rpc ReloadPodConfig(PodRef) returns (Pod);

  // Time machine: instant rootfs snapshots of a pod. commit is atomic
  // (CoW); rollback stops the pod, swaps the rootfs, and leaves it stopped.
  rpc CommitPod(CommitPodRequest) returns (Snapshot);
  rpc RollbackPod(RollbackPodRequest) returns (Pod);
  rpc ListSnapshots(PodRef) returns (SnapshotList);
  rpc DeleteSnapshot(SnapshotRef) returns (Empty);

  // Stacks (Compose/K8s-pod model): the CLI sends the stack.toml contents;
  // members run as pods named <stack>-<member> inside one shared netns.
  rpc ApplyStack(ApplyStackRequest) returns (ApplyStackResponse);
  rpc DestroyStack(PodRef) returns (Empty);

  rpc Exec(stream ExecChunk) returns (stream ExecChunk);
  rpc PodMetrics(PodRef) returns (stream Metric);
  rpc StreamLogs(PodRef) returns (stream LogLine);

  rpc CreateShm(ShmRequest) returns (ShmSegment);
  rpc ListShm(PodRef) returns (ShmList);
  rpc RemoveShm(ShmRef) returns (Empty);

  // Provision/start the managed ingress gateway pod (local PKI + the
  // rustypods-ingress proxy), and report its health/route table.
  rpc InitIngress(InitIngressRequest) returns (IngressDeployment);
  rpc IngressGatewayStatus(IngressGatewayStatusRequest) returns (IngressGatewayStatusResponse);
}

// In-pod agent → daemon, on the per-pod socket /run/rustypods/run/agent.sock.
service Agent {
  rpc Ping(Empty) returns (AgentInfo);
  rpc StreamMetrics(stream Metric) returns (Empty);
}

message AgentInfo {
  string version = 1;
}

// mmap-able shared segment: host path under /dev/shm/rustypods/<pod>,
// pod path under /run/rustypods/shm. Same pages both sides (tmpfs).
message ShmRequest {
  string pod = 1;
  string name = 2;
  uint64 size_bytes = 3;
}
message ShmSegment {
  string name = 1;
  string host_path = 2;
  string pod_path = 3;
  uint64 size_bytes = 4;
}
message ShmList {
  repeated ShmSegment segs = 1;
}
message ShmRef {
  string pod = 1;
  string name = 2;
}

message Empty {}
message PingRequest {}

message DaemonInfo {
  string version = 1;
  string socket_path = 2;
  string data_dir = 3;
  bool machined = 4;
  bool btrfs = 5;
  // Active drivers, e.g. "btrfs" / "reflink-copy", "systemd-nspawn" —
  // lets clients (and a future GUI) show which capabilities are live.
  string storage_driver = 6;
  string runtime_engine = 7;
}

message Image {
  string name = 1;
  string path = 2;
  string source = 3;
  uint64 created_unix = 4;
  // OCI config (empty for distrobox imports). Pods on images with an
  // entrypoint/cmd start in non-boot mode — they carry no systemd.
  repeated string entrypoint = 5;
  repeated string cmd = 6;
}

message ImageList {
  repeated Image images = 1;
}

message ImageRef {
  string name = 1;
}

message ListImagesRequest {}

message ImportImageRequest {
  string name = 1;
  // Rootless podman container to export (e.g. "arch").
  string distrobox = 2;
  // Host user owning the rootless podman store (root podman cannot see it).
  string import_user = 3;
}

message PullImageRequest {
  // OCI reference, e.g. "busybox:latest" or "ghcr.io/org/tool:v1".
  string reference = 1;
  // Optional image name; default = "<repo-basename>-<tag>" slug.
  string name = 2;
}

enum PodState {
  POD_STATE_UNKNOWN = 0;
  POD_STATE_CREATED = 1;
  POD_STATE_RUNNING = 2;
  POD_STATE_STOPPED = 3;
  POD_STATE_FAILED = 4;
}

message Limits {
  // 0 = unset. Applied to machine-<name>.scope after nspawn registers.
  uint64 memory_high_bytes = 1;
  uint64 memory_max_bytes = 2;
  uint32 cpu_quota_percent = 3;
}

message Pod {
  string name = 1;
  string image = 2;
  string rootfs = 3;
  PodState state = 4;
  uint32 leader_pid = 5;
  uint64 created_unix = 6;
  Limits limits = 7;
  bool ephemeral = 8;
  // Btrfs qgroup cap on the pod's rootfs subvolume (0 = none).
  uint64 storage_max_bytes = 9;
  // "hostPort:podPort" mappings; imply --network-veth (private netns)
  // for standalone pods, or publish on the shared netns IP for stacks.
  repeated string ports = 10;
  // Stack this pod belongs to ("" = standalone). Stack members share one
  // netns — they reach each other on 127.0.0.1, like K8s pod containers.
  string stack = 11;
  // "host[:pod][:ro]" bind mounts, applied at start.
  repeated string binds = 12;
  // nspawn --private-users=pick: pod root is not host root.
  bool private_users = 13;
  // Snapshot GC: keep at most this many commits (0 = unlimited).
  uint32 snap_keep_last = 14;
  // Snapshot GC: drop commits older than this many seconds (0 = unlimited).
  uint64 snap_max_age_secs = 15;
  // Start this pod automatically whenever the daemon boots.
  bool autostart = 16;
  // Per-pod payload override: replaces the image's entrypoint+cmd and
  // forces non-boot mode, even on boot-capable images (e.g.
  // ["sleep", "infinity"] to keep a bare OCI image alive as a dev pod).
  repeated string cmd = 17;
  // Hostname-based ingress rules — routed by the pod's private-network
  // address once the ingress proxy lands; each host is globally unique
  // across all pods.
  repeated IngressRule ingress = 18;
  // This pod IS the ingress gateway (the rustypods-ingress proxy
  // itself). Managed pod — created only via InitIngress.
  bool ingress_gateway = 19;
}

message PodList {
  repeated Pod pods = 1;
}

message PodRef {
  string name = 1;
}

message ListPodsRequest {}

message CreatePodRequest {
  string name = 1;
  string image = 2;
  uint64 storage_max_bytes = 3;
  repeated string ports = 4;
  // Desktop preset: caller's home + /tmp rw, /run/user/<uid> + /dev/dri ro.
  // Implies private_users = false (a shared home needs host-uid identity).
  bool desktop = 5;
  // "host[:pod][:ro]" bind mounts, applied at start.
  repeated string binds = 6;
  // Resource guardrails, persisted in the conf; 0 fields = unlimited.
  // Applied to machine-<name>.scope on every start.
  optional Limits limits = 7;
  // Start this pod automatically whenever the daemon boots.
  bool autostart = 8;
  // Per-pod payload override (see Pod.cmd); empty = image default.
  repeated string cmd = 9;
  // Ingress rules (see Pod.ingress); imply private networking.
  repeated IngressRule ingress = 10;
}

message ClonePodRequest {
  string source = 1;
  string dest = 2;
}

message CommitPodRequest {
  string pod = 1;
  // Optional human tag, e.g. "pre-upgrade". Slugified into the snapshot id.
  string label = 2;
}

message RollbackPodRequest {
  string pod = 1;
  // Snapshot id; "" = latest.
  string snapshot = 2;
}

message Snapshot {
  string id = 1; // "<unix_ts>[-label]"
  string pod = 2;
  uint64 created_unix = 3;
  string path = 4;
  string label = 5;
}

message SnapshotList {
  repeated Snapshot snapshots = 1;
}

message SnapshotRef {
  string pod = 1;
  string id = 2;
}

message ApplyStackRequest {
  // Raw stack.toml — sent over the wire so `apply` also works via --remote.
  bytes toml = 1;
}

message ApplyStackResponse {
  string name = 1;
  repeated Pod pods = 2;
}

message PortMappings {
  // "hostPort:podPort[/tcp|/udp]" — full desired list, replaces current.
  repeated string ports = 1;
}

message BindList {
  // "host[:pod][:ro]" — full desired list, replaces current.
  repeated string binds = 1;
}

message CmdList {
  // Full desired payload argv, replaces current. Empty = clear override.
  repeated string argv = 1;
}

// A hostname routed to one in-pod port. The host must be a lowercase DNS
// name ending in .rustypods.localhost with at least one label in front.
message IngressRule {
  string host = 1;
  uint32 pod_port = 2;
}

message IngressList {
  // Full desired rule set, replaces current. Empty = clear ingress.
  repeated IngressRule rules = 1;
}

message UpdatePodConfigRequest {
  string name = 1;
  Limits limits = 2;
  // Concrete value — the CLI resolves "flag absent = keep current" itself.
  // 0 = no cap. Hot-applied via btrfs qgroup on the pod rootfs.
  uint64 storage_max_bytes = 3;
  // Absent = keep current mappings; present (even empty) = replace + resync NAT.
  optional PortMappings ports = 4;
  // Absent = keep current binds; present (even empty) = replace.
  // Takes effect on the next pod start.
  optional BindList binds = 5;
  // Absent = keep; 0 = clear (no count-based snapshot GC).
  optional uint32 snap_keep_last = 6;
  // Absent = keep; 0 = clear (no age-based snapshot GC).
  optional uint64 snap_max_age_secs = 7;
  // Absent = keep; present = set the boot-time autostart flag.
  optional bool autostart = 8;
  // Absent = keep; present (even empty) = replace the payload override.
  // Takes effect on the next pod start.
  optional CmdList cmd = 9;
  // Absent = keep current ingress rules; present (even empty) = replace.
  // Ingress changes require a stopped pod.
  optional IngressList ingress = 10;
}

message StartPodRequest {
  string name = 1;
  Limits limits = 2;
  // -x: nspawn snapshots the pod dir itself and discards changes on exit.
  bool ephemeral = 3;
  // Stronger isolation at the cost of host-uid identity (breaks shared
  // home-dir writes as `nick`). Maps to nspawn --private-users=pick.
  // Absent = keep the conf value; present = override and persist.
  optional bool private_users = 4;
}

// Bidi exec: first client chunk is `start`; then stdin/winsize flow in,
// stdout/stderr/exit flow out.
message ExecChunk {
  oneof kind {
    ExecStart start = 1;
    bytes stdin = 2;
    bytes stdout = 3;
    bytes stderr = 4;
    WinSize winsize = 5;
    ExecExit exit = 6;
  }
}

message ExecStart {
  string pod = 1;
  // Container user; empty = root.
  string user = 2;
  // Empty argv → login shell ($SHELL -l from the image's /etc/passwd).
  repeated string argv = 3;
  bool tty = 4;
  uint32 rows = 5;
  uint32 cols = 6;
  repeated string env = 7; // "K=V", TERM etc.
  // Absolute in-container cwd for the payload; empty = $HOME (login shell)
  // or the inherited cwd (argv mode).
  string workdir = 8;
}

message WinSize {
  uint32 rows = 1;
  uint32 cols = 2;
}

message ExecExit {
  int32 code = 1;
}

message Metric {
  uint64 ts_unix_ms = 1;
  uint64 mem_bytes = 2;
  uint64 mem_high_bytes = 3;
  double cpu_pct = 4;
  uint64 pids = 5;
  double mem_psi_avg10 = 6;
  double io_psi_avg10 = 7;
  double cpu_psi_avg10 = 8;
}

message LogLine {
  uint64 ts_unix_ms = 1;
  bytes data = 2;
}

// Daemon → rustypods-ingress, on the root-only socket
// /run/rustypods/run/ingress.sock. The daemon pushes the complete desired
// route table; the proxy swaps it in atomically (one generation = one
// coherent set — a partially applied snapshot never serves traffic).
service IngressControl {
  rpc ReplaceRoutes(RouteSnapshot) returns (RouteSnapshotAck);
  rpc GetStatus(IngressStatusRequest) returns (IngressStatus);
}

message ActiveIngressRoute {
  // Canonical host, e.g. web.rustypods.localhost.
  string host = 1;
  // Pod endpoint on the daemon-owned 10.220.0.0/16 (veth/stack IP).
  string backend_ip = 2;
  uint32 backend_port = 3;
}

message RouteSnapshot {
  // Daemon-side generation for observability; need not be monotonic
  // (a daemon restart may reset it).
  uint64 generation = 1;
  // The ENTIRE desired route set — replaces, never merges.
  repeated ActiveIngressRoute routes = 2;
}

message RouteSnapshotAck {
  uint64 generation = 1;
  uint32 route_count = 2;
}

message IngressStatusRequest {}

message IngressStatus {
  uint64 generation = 1;
  uint32 route_count = 2;
}

// InitIngress: image must carry the host-built rustypods-ingress binary
// ABI (the daemon copies it in — pick an image matching the host libc,
// e.g. debian for a Debian host). install_ca also drops the generated CA
// into the host trust store (explicit opt-in — it mutates system trust).
message InitIngressRequest {
  string image = 1;
  bool install_ca = 2;
}

message IngressDeployment {
  Pod pod = 1;
  // Where the local CA cert lives inside the daemon's pki dir.
  string ca_cert_path = 2;
  // Whether the CA was also installed into the host trust store.
  bool ca_installed = 3;
}

message IngressGatewayStatusRequest {}

message IngressGatewayStatusResponse {
  // The managed gateway pod exists in state.
  bool configured = 1;
  // It currently has a live leader pid.
  bool running = 2;
  // Its control socket answers GetStatus.
  bool control_ready = 3;
  uint64 generation = 4;
  uint32 route_count = 5;
  string ca_cert_path = 6;
}
