[package]
name = "rustypods-gui"
version = "0.1.0"
edition = "2021"
description = "RustyPods Desktop — Tauri GUI for rustypodsd"

[lib]
name = "rustypods_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "io-util", "sync", "time", "macros"] }
tokio-stream = "0.1"
tonic = "0.14"
rustypods-client = { path = "../../crates/rustypods-client" }
rustypods-proto = { path = "../../crates/rustypods-proto" }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
